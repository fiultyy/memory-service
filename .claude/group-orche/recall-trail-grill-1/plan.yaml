      - { id: chain-concurrency, parent: grill-fragile-chain, angle: "并发安全", depth: 0, status: done, result_ref: results/r2-chain-concurrency.md, verdict: "文件方案不可行;被 env 取代" }
      - { id: bloat-strategy-compare, parent: grill-idempotent-edge, angle: "清理策略", depth: 0, status: done, result_ref: results/r2-bloat-strategy-compare.md, verdict: "清空重写(~15 行改 update_memory_md);否决 LIF 阈值/滑窗" }
      - { id: bloat-semantic-unify, parent: grill-idempotent-edge, angle: "语义统一", depth: 0, status: done, result_ref: results/r2-bloat-semantic-unify.md, verdict: "UNION 两源 + 每次重写;ADR-16c 加 (g) build-index --session;⚠ 当前无 # [mem] 段标题(散行),P2 需正则删/聚段" }
      - { id: bloat-adr15-impact, parent: grill-idempotent-edge, angle: "波及 ADR-15", depth: 0, status: done, result_ref: results/r2-bloat-adr15-impact.md, verdict: "波及仅 build_index;统一改=修 ADR-15 累积 bug;Node C 扩容" }
      - { id: noise-threshold-basis, parent: grill-noise-vs-value, angle: "阈值依据+top_k", depth: 0, status: done, result_ref: results/r2-noise-threshold-basis.md, verdict: "recall.py:249 score>=0.3(α=0.5 对齐);cli 加 --top-k 默认 None" }
      - { id: noise-marginal-value, parent: grill-noise-vs-value, angle: "边际价值量化", depth: 0, status: done, result_ref: results/r2-noise-marginal-value.md, verdict: "形式1 保留(LIF gap 17%+ 首次召回窗口);score 0.3 过滤;限定场景可 defer" }

reconcile:
  - { between: [grill-fragile-chain, chain-alt-mechanism, chain-hook-feasibility], issue: "传递链修法:hook vs env", verdict: "已确认(P5):env 胜出(CLAUDE_CODE_SESSION_ID 零侵入,3 份一致 + 主 session 实测);hook/文件方案作废。ADR-16a 改写,Node B 简化" }
