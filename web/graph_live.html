<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>memsvc · KG 实时生长图</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0f17; --panel:#111827e6; --line:#1f2937; --fg:#e5e7eb; --dim:#9ca3af; --acc:#38bdf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
              font:13px/1.5 ui-sans-serif,system-ui,"Noto Sans SC",sans-serif; }
  #app { display:grid; height:100vh; grid-template-rows:44px 1fr 52px; }
  /* 顶栏 */
  header { display:flex; align-items:center; gap:14px; padding:0 14px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; font-weight:600; letter-spacing:.02em; }
  .stat { color:var(--dim); } .stat b { color:var(--fg); font-variant-numeric:tabular-nums; }
  #conn { font-size:12px; padding:1px 8px; border-radius:10px; background:#1f2937; color:var(--dim); }
  #conn.live { background:#064e3b; color:#6ee7b7; }
  #conn.off  { background:#7f1d1d; color:#fca5a5; }
  .grow { flex:1; }
  button { background:#1f2937; color:var(--fg); border:1px solid #374151; border-radius:6px;
           padding:4px 12px; cursor:pointer; font-size:12px; }
  button:hover { background:#374151; }
  button.warn { background:#7c2d12; border-color:#9a3412; }
  /* 主区: 画布 + 侧栏 */
  #main { position:relative; }
  #graph { position:absolute; inset:0; }
  #side { position:absolute; top:10px; left:10px; width:320px; max-height:calc(100% - 20px);
          display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px; pointer-events:auto; backdrop-filter:blur(4px);
          overflow:auto; }
  #node-card { display:none; }
  #node-card h3 { font-size:13px; margin-bottom:4px; word-break:break-all; }
  #node-card .meta { color:var(--dim); font-size:12px; }
  #node-card ul { list-style:none; margin-top:6px; max-height:180px; overflow:auto; }
  #node-card li { padding:3px 0; border-top:1px solid #1f2937aa; font-size:12px; }
  #node-card li .pred { color:var(--acc); }
  #node-card li .when { color:var(--dim); float:right; }
  #log-card { flex:0 0 auto; max-height:150px; }
  #log-card h4, #node-card h4 { font-size:11px; color:var(--dim); text-transform:uppercase;
          letter-spacing:.08em; margin-bottom:4px; }
  #log { font-size:12px; color:var(--dim); max-height:110px; overflow:auto; }
  #log div { padding:1px 0; } #log b { color:#6ee7b7; font-weight:500; }
  .close { float:right; cursor:pointer; color:var(--dim); } .close:hover { color:var(--fg); }
  /* 底栏: 时间滑条 */
  footer { display:flex; align-items:center; gap:12px; padding:0 14px;
           background:var(--panel); border-top:1px solid var(--line); }
  footer label { color:var(--dim); font-size:12px; white-space:nowrap; }
  #slider { flex:1; accent-color:var(--acc); }
  #t0,#t1 { font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; min-width:150px; }
  #edge-visible { color:var(--dim); font-size:12px; white-space:nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "graphology": "https://cdn.jsdelivr.net/npm/graphology@0.26.0/+esm",
    "fa2": "https://cdn.jsdelivr.net/npm/graphology-layout-forceatlas2@0.10.1/+esm",
    "sigma": "https://cdn.jsdelivr.net/npm/sigma@3.0.2/+esm"
  }
}
</script>
</head>
<body>
<div id="app">
  <header>
    <h1>memsvc · KG 实时生长图</h1>
    <span class="stat">节点 <b id="n-nodes">0</b></span>
    <span class="stat">边 <b id="n-edges">0</b></span>
    <span class="stat">推送 <b id="n-push">0</b></span>
    <span id="conn">连接中…</span>
    <span class="grow"></span>
    <button id="btn-mode">视图: tag 聚合</button>
    <button id="btn-color">着色: 社区色</button>
    <button id="btn-relayout">重新布局</button>
    <button id="btn-fit">重置视图</button>
    <button id="btn-pause">暂停推送</button>
  </header>
  <div id="main">
    <div id="graph"></div>
    <div id="side">
      <div class="card" id="filter-card">
        <h4>过滤 <span id="filter-stat" style="float:right;text-transform:none;letter-spacing:0"></span></h4>
        <div id="type-boxes" style="display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0"></div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
          <label style="color:var(--dim);font-size:12px">最小度
            <select id="mindeg" style="background:#1f2937;color:var(--fg);border:1px solid #374151;border-radius:6px;padding:2px 6px">
              <option value="0">全部</option><option value="1">≥1</option>
              <option value="2" selected>≥2</option><option value="3">≥3</option><option value="5">≥5</option>
            </select></label>
          <input id="search" type="search" placeholder="搜索实体聚焦…"
                 style="flex:1;background:#1f2937;color:var(--fg);border:1px solid #374151;border-radius:6px;padding:3px 8px;font-size:12px">
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <button id="btn-focus" style="padding:2px 10px">关系聚焦: 关</button>
          <label style="color:var(--dim);font-size:12px">跳数
            <select id="hops" style="background:#1f2937;color:var(--fg);border:1px solid #374151;border-radius:6px;padding:2px 6px">
              <option value="1">1</option><option value="2" selected>2</option>
              <option value="3">3</option><option value="4">4</option>
            </select></label>
          <span id="focus-hint" style="color:var(--acc);font-size:12px;flex:1"></span>
        </div>
      </div>
      <div class="card" id="node-card">
        <span class="close" data-close="node-card">✕</span>
        <h3 id="nd-name"></h3>
        <div class="meta" id="nd-meta"></div>
        <div class="meta" id="nd-aliases"></div>
        <h4 style="margin-top:8px">关联边</h4>
        <ul id="nd-edges"></ul>
      </div>
      <div class="card" id="log-card">
        <h4>生长事件流</h4>
        <div id="log"><div>等待推送… (inotify 事件驱动, 无轮询)</div></div>
      </div>
    </div>
  </div>
  <footer>
    <label>时间窗</label>
    <span id="t0">—</span>
    <input id="slider" type="range" min="0" max="1000" value="0">
    <span id="t1">—</span>
    <span id="edge-visible"></span>
  </footer>
</div>
<script type="module">
const Graph = (await import("graphology")).default;
import * as FA2NS from "fa2";
import * as SigmaNS from "sigma";
const forceAtlas2 = FA2NS.default ?? FA2NS;
const Sigma = SigmaNS.Sigma ?? SigmaNS.default;

const TYPE_COLOR = {
  // v2 atom label 四类主色 + legacy entity_type 兜底
  fact: "#38bdf8", judgment: "#fbbf24", experience: "#34d399", summary: "#a78bfa",
  technical_term: "#64748b", concept: "#a78bfa", named_entity: "#fbbf24",
  identifier: "#94a3b8", quoted_term: "#f472b6", person: "#34d399",
  project: "#f97316", tool: "#22d3ee", file: "#e879f9", tag: "#f59e0b",
  cluster: "#818cf8", sub: "#c084fc",
};
const hashColor = s => `hsl(${[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360} 65% 60%)`;

/* 双视图状态: mode = atom(原子图) | tag(tag 聚合枢纽图); colorBy = type | comm */
const TAG_COLOR = "#f59e0b";
const COMM_PALETTE = ["#38bdf8","#f472b6","#34d399","#fbbf24","#a78bfa",
                      "#22d3ee","#fb923c","#4ade80","#e879f9","#facc15",
                      "#60a5fa","#f87171"];
let mode = "atom", colorBy = "type";
const store = { nodes: new Map(), edges: new Map(), tags: new Map(),
                mounts: [], clusters: [], comm: {} };
const nodeColor = n => colorBy === "comm" && store.comm[n.id] != null
  ? COMM_PALETTE[store.comm[n.id] % COMM_PALETTE.length]
  : (TYPE_COLOR[n.entity_type] ?? hashColor(n.id));

const graph = new Graph({ multi: true, type: "directed" });
const renderer = new Sigma(graph, document.getElementById("graph"),
                           { allowInvalidContainer: true, renderEdgeLabels: false,
                             labelDensity: 0.7, labelGridCellSize: 90,
                             defaultEdgeType: "line" });
const container = document.getElementById("graph");

/* ── 时间窗 (slider 截止 = 只看 [最老, cutoff] 的边? 反向: 只看 ≥ cutoff 的新边) ── */
let tMin = Infinity, tMax = -Infinity;   // epoch ms
const tsOf = s => s ? Date.parse(s) : NaN;
let cutoff = 0;                          // epoch ms; 0 = 全部显示
const $ = id => document.getElementById(id);

function noteAttrs(e) {                  // 边 → 记录时间轴范围 (颜色在 edgeReducer 算)
  const ts = tsOf(e.created_at);
  if (Number.isFinite(ts)) { tMin = Math.min(tMin, ts); tMax = Math.max(tMax, ts); }
  return e;
}
function edgeAttrs(e) {
  const ts = tsOf(e.created_at);
  return { id: e.id, _ts: ts, label: e.predicate,
           _topic: e.topic || e.value || "", size: 1, _lif: e.LIF, color: "#475569" };
}

/* ── reducers: 过滤(类型/度数/时间窗) + 搜索聚焦 + 类型着色 ── */
let hiddenNodes = new Set();             // 类型/度数过滤掉的节点
const filters = { types: null, minDeg: 2, q: "" };   // types=null=全选(等快照后建)
const searchMatch = () => {              // 搜索命中集 (大小写不敏感, name+aliases)
  if (!filters.q) return null;
  const q = filters.q.toLowerCase(), hit = new Set();
  graph.forEachNode((id, a) => {
    if ((a.name ?? "").toLowerCase().includes(q) ||
        (Array.isArray(a.aliases) && a.aliases.some(s => String(s).toLowerCase().includes(q))))
      hit.add(id);
  });
  return hit;
};
let matchSet = null, focusNode = null;
let focusOn = false, focusBase = null, focusHops = 2;
let visNodesCache = new Set();           // 时间窗可见节点集 (裁剪边后的两端)
function computeHidden() {               // 每次过滤条件变化重算 (含时间窗可见节点集)
  hiddenNodes = new Set();
  graph.forEachNode((id, a) => {
    if (filters.types && !filters.types.has(a.entity_type)) hiddenNodes.add(id);
    else if ((a.degree ?? 0) < filters.minDeg) hiddenNodes.add(id);
  });
  if (focusOn && focusBase && graph.hasNode(focusBase)) {   // 关系聚焦: BFS N 跳邻域
    const keep = new Set([focusBase]);
    let frontier = [focusBase];
    for (let i = 0; i < focusHops; i++) {
      const nxt = [];
      for (const n of frontier)
        graph.forEachNeighbor(n, nb => { if (!keep.has(nb)) { keep.add(nb); nxt.push(nb); } });
      frontier = nxt;
    }
    for (const id of graph.nodes()) if (!keep.has(id)) hiddenNodes.add(id);
    $("focus-hint").textContent =
      `${focusHops} 跳 · ${keep.size} 节点`;
  }
  matchSet = searchMatch();
  visNodesCache = new Set();
  if (cutoff) graph.forEachEdge((eid, a, s, t) => {
    if ((!Number.isFinite(a._ts) || a._ts >= cutoff) &&
        !hiddenNodes.has(s) && !hiddenNodes.has(t)) { visNodesCache.add(s); visNodesCache.add(t); }
  });
  const visN = graph.order - hiddenNodes.size;
  $("filter-stat").textContent = `显示 ${visN}/${graph.order}`;
  let visE = 0;                          // 可见边 = 两端都未被过滤 (∧时间窗)
  graph.forEachEdge((eid, a, s, t) => {
    if (!hiddenNodes.has(s) && !hiddenNodes.has(t) &&
        (!cutoff || !Number.isFinite(a._ts) || a._ts >= cutoff)) visE++;
  });
  $("edge-visible").textContent = `边 ${visE}/${graph.size}`;
}
renderer.setSetting("nodeReducer", (node, data) => {
  if (hiddenNodes.has(node)) return { ...data, hidden: true };
  const t = (data.entity_type === "cluster" || data.entity_type === "sub")
    ? COMM_PALETTE[(data.ci ?? 0) % COMM_PALETTE.length]
    : data.entity_type === "tag" ? TAG_COLOR : nodeColor(data);
  const size = data.entity_type === "cluster" ? 9
    : data.entity_type === "sub" ? 3.5
    : data.entity_type === "tag" ? 4 + Math.log2(1 + (data.degree ?? 1)) * 2
    : (mode === "tag" ? 1.2 : 2 + Math.sqrt(data.degree ?? 1) * 1.6);
  const base = { ...data, color: t, size,
                 highlighted: node === highlightNode || undefined };
  if (matchSet) {                        // 搜索: 命中高亮放大, 其余压暗去标签
    const hit = matchSet.has(node);
    return { ...base, size: hit ? base.size * 1.5 : base.size * 0.4,
             color: hit ? t : "#334155", label: hit ? data.label : null,
             forceLabel: hit, highlighted: hit || base.highlighted };
  }
  return base;
});
renderer.setSetting("edgeReducer", (edge, data) => {
  const [s, t] = graph.extremities(edge);
  if (hiddenNodes.has(s) || hiddenNodes.has(t)) return { ...data, hidden: true };
  const vis = !cutoff || !Number.isFinite(data._ts) || data._ts >= cutoff;
  // 年龄色在此处算 (非入图时): tMin/tMax 随增量后移, reducer 每次 refresh 重算保持一致
  const age01 = Number.isFinite(data._ts) && tMax > tMin ? (data._ts - tMin) / (tMax - tMin) : 0;
  const dimmed = matchSet && !(matchSet.has(s) || matchSet.has(t));
  return { ...data, hidden: !vis,
           color: dimmed ? "#1e293b" : `hsl(${210 - 190 * age01} 80% ${40 + 20 * age01}%)`,
           size: vis ? (dimmed ? 0.5 : 1 + age01) : 1 };
});
function refreshTimeWindow() {
  computeHidden();
  renderer.refresh();
}

/* ── 布局 ── */
function ringPos(n) {                    // 新节点: 靠已有邻居放, 否则外圈
  const nb = graph.neighbors(n);
  for (const x of nb) {
    const a = graph.getNodeAttributes(x);
    if (Number.isFinite(a.x)) {
      const ang = Math.random() * 2 * Math.PI;
      return { x: a.x + Math.cos(ang) * .8, y: a.y + Math.sin(ang) * .8 };
    }
  }
  const ang = Math.random() * 2 * Math.PI, r = 30 + 10 * Math.sqrt(graph.order);
  return { x: Math.cos(ang) * r, y: Math.sin(ang) * r };
}
function layout(iterations = 80) {
  if (graph.order < 2) return;
  try {
    forceAtlas2.assign(graph, { iterations,
      settings: { barnesHutOptimize: graph.order > 800, gravity: 0.6,
                  scalingRatio: 6, slowDown: 1 + Math.log10(graph.order),
                  adjustSizes: true } });
    renderer.refresh(); fitView();
  } catch (err) { console.error("FA2 failed", err); }
}
function fitView() {
  if (!graph.order) return;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, any = false;
  graph.forEachNode((_n, a) => { if (Number.isFinite(a.x)) {
    any = true; minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x);
    minY = Math.min(minY, a.y); maxY = Math.max(maxY, a.y); } });
  if (!any) return;
  const w = maxX - minX, h = maxY - minY;
  renderer.getCamera().animate(
    { x: (minX + maxX) / 2 / (w || 1), y: (minY + maxY) / 2 / (h || 1),
      ratio: Math.max(w, h) > 0 ? 1.6 * Math.max(w, h) / 800 : 1, angle: 0 },
    { duration: 300 });
}

/* ── 快照 + 增量应用 ── */
let cursor = { entity: 0, fact: 0 }, pushes = 0, paused = false, es = null;
function applyDelta(d, isSnapshot = false) {
  for (const n of d.nodes) {
    const old = store.nodes.get(n.id);
    store.nodes.set(n.id, old ? { ...old, ...n } : n);
  }
  for (const e of d.edges) store.edges.set(e.id, e);
  cursor = d.cursor;
  if (mode === "tag") {          // tag 视图: 增量原子以小点入图 (挂载边需刷新快照)
    const nn = d.nodes.filter(n => !graph.hasNode(n.id));
    for (const n of nn) if (store.comm[n.id] == null)
      graph.addNode(n.id, { ...n, label: (n.name ?? "").slice(0, 40),
                            x: (Math.random() - .5) * 100, y: (Math.random() - .5) * 100,
                            size: 1, color: nodeColor(n) });
    $("n-nodes").textContent = graph.order; $("n-edges").textContent = graph.size;
    return { nn, ne: [] };
  }
  const nn = [], ne = [];
  for (const n of d.nodes) {
    if (graph.hasNode(n.id)) { graph.mergeNodeAttributes(n.id, { degree: n.degree }); continue; }
    const pos = isSnapshot ? { x: (Math.random() - .5) * 100, y: (Math.random() - .5) * 100 } : ringPosPre(n);
    graph.addNode(n.id, { ...n, label: (n.name ?? "").slice(0, 40), ...pos,
                           size: 2, color: nodeColor(n) });
    nn.push(n);
  }
  for (const e of d.edges) {
    if (!graph.hasNode(e.subject_id) || !graph.hasNode(e.object_id)) continue; // 悬空防线
    if (graph.hasEdge(e.id)) continue;
    // graphology 的带 key 加边是独立方法 (addEdge 无 4 参 (key,s,t,attrs) 形式, 实测会错位)
    graph.addEdgeWithKey(e.id, e.subject_id, e.object_id, edgeAttrs(noteAttrs(e)));
    ne.push(e);
  }
  $("n-nodes").textContent = graph.order; $("n-edges").textContent = graph.size;
  return { nn, ne };
}

/* 视图切换: 从 store 全量重建 (坐标丢弃 → layout 重排) */
const seedPos = (r = 60) => { const a = Math.random() * 2 * Math.PI;
  return { x: Math.cos(a) * r * Math.sqrt(Math.random() + .2),
           y: Math.sin(a) * r * Math.sqrt(Math.random() + .2) }; };
function buildGraph() {
  graph.clear();
  tMin = Infinity; tMax = -Infinity;
  if (mode === "atom") {
    for (const n of store.nodes.values())
      graph.addNode(n.id, { ...n, label: (n.name ?? "").slice(0, 40),
                            ...seedPos(), size: 2, color: nodeColor(n) });
    for (const e of store.edges.values()) {
      if (!graph.hasNode(e.subject_id) || !graph.hasNode(e.object_id)) continue;
      if (!graph.hasEdge(e.id))
        graph.addEdgeWithKey(e.id, e.subject_id, e.object_id, edgeAttrs(noteAttrs(e)));
    }
  } else {          // tag 聚合三层树: atom 小点 → tag 枢纽 → 主题簇超枢纽
    for (const n of store.nodes.values())
      graph.addNode(n.id, { ...n, label: (n.name ?? "").slice(0, 40),
                            ...seedPos(), size: 1.2, color: nodeColor(n) });
    const tname = id => store.tags.get(id)?.name ?? "?";
    // 第四层预扫描: 每 tag 的 live 原子按 louvain 社区分组, >1 组才有子团
    const subGroups = new Map();              // tag -> Map(comm -> 子团节点 id)
    for (const t of store.tags.values()) {
      const gs = new Map();                   // comm -> [atomId…]
      for (const m of store.mounts) {
        if (m.tag !== t.id) continue;
        const cm = store.comm[m.atom];
        if (cm == null || !store.nodes.has(m.atom)) continue;
        (gs.get(cm) ?? gs.set(cm, []).get(cm)).push(m.atom);
      }
      for (const [cm, atoms] of gs) if (atoms.length < 2) gs.delete(cm);
      if (gs.size < 2) continue;             // 单原子组不成团, 直挂 tag
      const gm = new Map();
      for (const [cm, atoms] of gs) {
        const sid = `s:${t.id}:${cm}`;
        const rep = atoms.map(a => store.nodes.get(a))
                         .sort((x, y) => (y.degree ?? 0) - (x.degree ?? 0))[0];
        graph.addNode(sid, { id: sid, name: rep?.name ?? "?",
                             label: (rep?.name ?? "?").slice(0, 22),
                             entity_type: "sub", degree: atoms.length,
                             aliases: atoms.slice(0, 8).map(a => store.nodes.get(a)?.name),
                             ci: cm, ...seedPos(), size: 3.5, forceLabel: true });
        graph.addEdgeWithKey(`sk:${t.id}:${cm}`, sid, "t:" + t.id,
          { label: "组", _topic: "", _ts: NaN, _lif: 1, size: 1,
            color: TAG_COLOR, type: "arrow" });
        gm.set(cm, sid);
      }
      subGroups.set(t.id, gm);
    }
    for (const t of store.tags.values()) {
      const id = "t:" + t.id;
      graph.addNode(id, { id, name: "#" + t.name, label: t.name.slice(0, 24),
                          entity_type: "tag", degree: t.mounts, aliases: [],
                          created_at: t.t0 ? `${t.t0?.slice(0, 10)} ~ ${t.t1?.slice(0, 10)}` : null,
                          ...seedPos(), size: 5, color: TAG_COLOR, forceLabel: true });
    }
    for (const c of store.clusters) {
      const id = "c:" + c.id;
      const label = c.members.slice(0, 2).map(tname).join(" · ");
      graph.addNode(id, { id, name: label, label: label.slice(0, 26),
                          entity_type: "cluster", degree: c.atoms,
                          aliases: c.members.map(tname),
                          ci: c.id, ...seedPos(), size: 9,
                          color: COMM_PALETTE[c.id % COMM_PALETTE.length],
                          forceLabel: true });
      for (const t of c.members) {
        const tid = "t:" + t;
        if (graph.hasNode(tid) && !graph.hasEdge(`k:${c.id}:${t}`))
          graph.addEdgeWithKey(`k:${c.id}:${t}`, tid, id,
            { label: "簇", _topic: "", _ts: NaN, _lif: 1, size: 1.4,
              color: COMM_PALETTE[c.id % COMM_PALETTE.length], type: "arrow" });
      }
    }
    for (const m of store.mounts) {
      const eid = `m:${m.tag}:${m.atom}`, tid = "t:" + m.tag;
      if (!graph.hasNode(m.atom) || !graph.hasNode(tid) || graph.hasEdge(eid)) continue;
      const ts = tsOf(m.ts);
      if (Number.isFinite(ts)) { tMin = Math.min(tMin, ts); tMax = Math.max(tMax, ts); }
      // 第四层: tag 内按 louvain 社区分组 — 多社区的 tag 插子团节点,
      // 原子挂子团、子团挂 tag; 单社区 tag 直挂 (不造只有一个孩子的假层级)
      const cm = store.comm[m.atom];
      const groups = subGroups.get(m.tag);
      const sid = cm != null && groups && groups.size > 1 ? groups.get(cm) : null;
      const mountAttrs = { label: "挂载", _topic: "", _ts: ts, _lif: m.w,
                           size: .6, color: "#334155" };
      if (sid && graph.hasNode(sid))
        graph.addEdgeWithKey(eid, m.atom, sid, mountAttrs);
      else
        graph.addEdgeWithKey(eid, m.atom, tid, mountAttrs);
    }
  }
  $("n-nodes").textContent = graph.order; $("n-edges").textContent = graph.size;
}
function switchMode() {
  mode = mode === "atom" ? "tag" : "atom";
  $("btn-mode").textContent = mode === "atom" ? "视图: tag 聚合" : "视图: 原子图";
  focusBase = null; $("focus-hint").textContent =
    focusOn ? "点击节点聚焦" : "";   // 图重建, 基点作废
  buildGraph(); buildTypeBoxes(); layout(100); refreshTimeWindow();
}
// ringPos 依赖图里有邻居 → 拆两步: 先加点(随便放)再在边加完后重摆新节点
const pendingPos = new Set();
function ringPosPre(n) { pendingPos.add(n.id); return { x: 0, y: 0 }; }
function settleNewNodes() {
  for (const id of pendingPos) if (graph.hasNode(id)) Object.assign(graph.getNodeAttributes(id), ringPos(id));
  pendingPos.clear();
}
function logLine(text, cls = "") {
  const el = $("log"), div = document.createElement("div");
  div.innerHTML = text; if (cls) div.className = cls;
  el.prepend(div); while (el.childElementCount > 30) el.lastChild.remove();
}
function applyAndAnnounce(d, tag) {
  const { nn, ne } = applyDelta(d);
  settleNewNodes();
  if (nn.length || ne.length) {
    logLine(`<b>+${nn.length} 节点</b> +${ne.length} 边 · ${tag} · ` +
      nn.slice(0, 3).map(n => n.name).join("、") + (nn.length > 3 ? " …" : ""));
    buildTypeBoxes();                  // 类型计数可能变
    refreshTimeWindow();               // 新节点也过一遍过滤器
  }
}

/* ── SSE 订阅 (inotify 事件驱动) ── */
const setConn = (txt, cls) => { const c = $("conn"); c.textContent = txt; c.className = cls ?? ""; };
let everConnected = false;
function connect() {
  if (new URLSearchParams(location.search).has("nosse")) { setConn("nosse 模式", ""); return; }
  if (es) es.close();
  es = new EventSource("/api/stream");
  es.onopen = () => {
    setConn("实时", "live");
    if (everConnected) catchUp();        // 断线重连: 补拉错过的事务
    everConnected = true;
  };
  es.onmessage = ev => {
    if (paused) return;
    const d = JSON.parse(ev.data);
    pushes++; $("n-push").textContent = pushes;
    applyAndAnnounce(d, new Date().toLocaleTimeString());
  };
  es.onerror = () => setConn("重连中…", "off");
}
async function catchUp() {
  const r = await fetch(`/api/graph?after_e=${cursor.entity}&after_f=${cursor.fact}`);
  const d = await r.json();
  if (d.edges?.length || d.nodes?.length) applyAndAnnounce(d, "补拉");
}

/* ── 交互 ── */
let highlightNode = null;
renderer.on("clickNode", ({ node }) => {
  highlightNode = node;
  const a = graph.getNodeAttributes(node);
  $("nd-name").textContent = a.name ?? node;
  $("nd-meta").textContent = `${a.entity_type} · 度 ${a.degree} · ${a.created_at ?? ""}`;
  const al = Array.isArray(a.aliases) ? a.aliases : [];
  $("nd-aliases").textContent = al.length ? `别名: ${al.join(" / ")}` : "";
  const ul = $("nd-edges"); ul.innerHTML = "";
  graph.forEachEdge(node, (eid, ea, _s, _t, sAttr, tAttr) => {
    const other = sAttr.id === node ? tAttr : sAttr;
    const li = document.createElement("li");
    li.innerHTML = `<span class="when">${Number.isFinite(ea._ts) ? new Date(ea._ts).toLocaleDateString() : ""}</span>` +
      `<span class="pred">${ea.label}</span> → ${other.name ?? ""}` +
      (ea._topic ? `<div style="color:var(--dim)">${ea._topic.slice(0, 80)}</div>` : "");
    ul.appendChild(li);
  });
  $("node-card").style.display = "block";
  if (focusOn) { focusBase = node; refreshTimeWindow(); }
  renderer.refresh();
});
document.querySelector('[data-close="node-card"]').onclick = () => {
  $("node-card").style.display = "none"; highlightNode = null;
  focusBase = null; $("focus-hint").textContent = ""; refreshTimeWindow();
};
renderer.on("clickStage", () => {
  $("node-card").style.display = "none"; highlightNode = null;
  focusBase = null; $("focus-hint").textContent = ""; refreshTimeWindow();
});
$("btn-focus").onclick = () => {
  focusOn = !focusOn;
  $("btn-focus").textContent = focusOn ? "关系聚焦: 开" : "关系聚焦: 关";
  $("btn-focus").className = focusOn ? "warn" : "";
  if (!focusOn) { focusBase = null; $("focus-hint").textContent = ""; }
  else $("focus-hint").textContent = "点击节点聚焦";
  refreshTimeWindow();
};
$("hops").onchange = ev => { focusHops = +ev.target.value; refreshTimeWindow(); };
$("btn-pause").onclick = () => {
  paused = !paused;
  $("btn-pause").textContent = paused ? "恢复推送" : "暂停推送";
  $("btn-pause").className = paused ? "warn" : "";
  if (paused) { es?.close(); setConn("已暂停", "off"); }
  else { catchUp().then(connect); }
};
$("btn-relayout").onclick = () => layout(120);
$("btn-mode").onclick = switchMode;
$("btn-color").onclick = () => {
  colorBy = colorBy === "type" ? "comm" : "type";
  $("btn-color").textContent = colorBy === "type" ? "着色: 社区色" : "着色: 类型色";
  renderer.refresh();   // 颜色在 nodeReducer 现算 → 直接重渲染即可
};
$("btn-fit").onclick = fitView;
$("slider").oninput = ev => {
  const v = +ev.target.value;
  cutoff = v === 0 ? 0 : tMin + (tMax - tMin) * (v / 1000);
  $("t0").textContent = cutoff ? new Date(cutoff).toLocaleString() : "全部";
  refreshTimeWindow();
};
$("mindeg").onchange = ev => { filters.minDeg = +ev.target.value; refreshTimeWindow(); };
let searchTimer = null;
$("search").oninput = ev => {          // 输入去抖 200ms; Enter 聚焦度最高的命中
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filters.q = ev.target.value.trim(); refreshTimeWindow(); }, 200);
};
$("search").onkeydown = ev => {
  if (ev.key !== "Enter" || !matchSet?.size) return;
  let best = null, bestDeg = -1;
  for (const id of matchSet) {
    const d = graph.getNodeAttribute(id, "degree") ?? 0;
    if (d > bestDeg) { bestDeg = d; best = id; }
  }
  if (best) {
    focusNode = best;
    highlightNode = best;
    const a = graph.getNodeAttributes(best);
    renderer.getCamera().animate({ x: a.x, y: a.y, ratio: 60 }, { duration: 400 });
    renderer.refresh();
  }
};

/* 类型勾选框 (快照后按实际类型+计数生成) */
function buildTypeBoxes() {
  const counts = {};
  graph.forEachNode((_id, a) => { counts[a.entity_type] = (counts[a.entity_type] ?? 0) + 1; });
  const box = $("type-boxes");
  box.innerHTML = "";
  filters.types = new Set(Object.keys(counts));
  for (const [t, c] of Object.entries(counts).sort((a, b) => b[1] - a[1])) {
    const lab = document.createElement("label");
    lab.style.cssText = "font-size:12px;cursor:pointer;display:flex;gap:3px;align-items:center";
    const dot = TYPE_COLOR[t] ?? hashColor(t);
    lab.innerHTML = `<input type="checkbox" checked data-type="${t}"
       style="accent-color:${dot}"><span style="color:${dot}">●</span>${t} <span style="color:var(--dim)">${c}</span>`;
    lab.querySelector("input").onchange = ev => {
      ev.target.checked ? filters.types.add(t) : filters.types.delete(t);
      refreshTimeWindow();
    };
    box.appendChild(lab);
  }
}

/* ── 启动 ── */
setConn("加载快照…");
const snap = await (await fetch("/api/graph")).json();
for (const n of snap.nodes) { /* 预摆环形坐标避免全 0 重叠 */
  const ang = Math.random() * 2 * Math.PI, r = 40 * Math.sqrt(snap.nodes.length);
  n.x = Math.cos(ang) * r; n.y = Math.sin(ang) * r;
}
applyDelta(snap, true);
store.tags = new Map((snap.tags ?? []).map(t => [t.id, t]));
store.mounts = snap.mounts ?? [];
store.comm = snap.comm ?? {};
store.clusters = snap.clusters ?? [];
layout(100);
const initSlider = () => {
  if (!Number.isFinite(tMin)) return;
  $("t1").textContent = new Date(tMax).toLocaleString();
  $("slider").max = "1000";
};
initSlider();
buildTypeBoxes();
refreshTimeWindow();
logLine(`快照载入: ${snap.nodes.length} 节点 / ${snap.edges.length} 边`, "");
connect();  // headless 冒烟可加 ?nosse=1 跳过 (SSE 长连接会挂住 virtual-time dump)
</script>
</body>
</html>
