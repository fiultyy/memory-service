<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>memsvc · KG 实时生长图</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0f17; --panel:#111827e6; --line:#1f2937; --fg:#e5e7eb; --dim:#9ca3af; --acc:#38bdf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
              font:13px/1.5 ui-sans-serif,system-ui,"Noto Sans SC",sans-serif; }
  #app { display:grid; height:100vh; grid-template-rows:44px 1fr 52px; }
  /* 顶栏 */
  header { display:flex; align-items:center; gap:14px; padding:0 14px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; font-weight:600; letter-spacing:.02em; }
  .stat { color:var(--dim); } .stat b { color:var(--fg); font-variant-numeric:tabular-nums; }
  #conn { font-size:12px; padding:1px 8px; border-radius:10px; background:#1f2937; color:var(--dim); }
  #conn.live { background:#064e3b; color:#6ee7b7; }
  #conn.off  { background:#7f1d1d; color:#fca5a5; }
  .grow { flex:1; }
  button { background:#1f2937; color:var(--fg); border:1px solid #374151; border-radius:6px;
           padding:4px 12px; cursor:pointer; font-size:12px; }
  button:hover { background:#374151; }
  button.warn { background:#7c2d12; border-color:#9a3412; }
  /* 主区: 画布 + 侧栏 */
  #main { position:relative; }
  #graph { position:absolute; inset:0; }
  #side { position:absolute; top:10px; left:10px; width:320px; max-height:calc(100% - 20px);
          display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px; pointer-events:auto; backdrop-filter:blur(4px);
          overflow:auto; }
  #node-card { display:none; }
  #node-card h3 { font-size:13px; margin-bottom:4px; word-break:break-all; }
  #node-card .meta { color:var(--dim); font-size:12px; }
  #node-card ul { list-style:none; margin-top:6px; max-height:180px; overflow:auto; }
  #node-card li { padding:3px 0; border-top:1px solid #1f2937aa; font-size:12px; }
  #node-card li .pred { color:var(--acc); }
  #node-card li .when { color:var(--dim); float:right; }
  #log-card { flex:0 0 auto; max-height:150px; }
  #log-card h4, #node-card h4 { font-size:11px; color:var(--dim); text-transform:uppercase;
          letter-spacing:.08em; margin-bottom:4px; }
  #log { font-size:12px; color:var(--dim); max-height:110px; overflow:auto; }
  #log div { padding:1px 0; } #log b { color:#6ee7b7; font-weight:500; }
  .close { float:right; cursor:pointer; color:var(--dim); } .close:hover { color:var(--fg); }
  /* 底栏: 时间滑条 */
  footer { display:flex; align-items:center; gap:12px; padding:0 14px;
           background:var(--panel); border-top:1px solid var(--line); }
  footer label { color:var(--dim); font-size:12px; white-space:nowrap; }
  #slider { flex:1; accent-color:var(--acc); }
  #t0,#t1 { font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; min-width:150px; }
  #edge-visible { color:var(--dim); font-size:12px; white-space:nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "graphology": "https://cdn.jsdelivr.net/npm/graphology@0.26.0/+esm",
    "fa2": "https://cdn.jsdelivr.net/npm/graphology-layout-forceatlas2@0.10.1/+esm",
    "sigma": "https://cdn.jsdelivr.net/npm/sigma@3.0.2/+esm"
  }
}
</script>
</head>
<body>
<div id="app">
  <header>
    <h1>memsvc · KG 实时生长图</h1>
    <span class="stat">节点 <b id="n-nodes">0</b></span>
    <span class="stat">边 <b id="n-edges">0</b></span>
    <span class="stat">推送 <b id="n-push">0</b></span>
    <span id="conn">连接中…</span>
    <span class="grow"></span>
    <button id="btn-relayout">重新布局</button>
    <button id="btn-fit">重置视图</button>
    <button id="btn-pause">暂停推送</button>
  </header>
  <div id="main">
    <div id="graph"></div>
    <div id="side">
      <div class="card" id="node-card">
        <span class="close" data-close="node-card">✕</span>
        <h3 id="nd-name"></h3>
        <div class="meta" id="nd-meta"></div>
        <div class="meta" id="nd-aliases"></div>
        <h4 style="margin-top:8px">关联边</h4>
        <ul id="nd-edges"></ul>
      </div>
      <div class="card" id="log-card">
        <h4>生长事件流</h4>
        <div id="log"><div>等待推送… (inotify 事件驱动, 无轮询)</div></div>
      </div>
    </div>
  </div>
  <footer>
    <label>时间窗</label>
    <span id="t0">—</span>
    <input id="slider" type="range" min="0" max="1000" value="0">
    <span id="t1">—</span>
    <span id="edge-visible"></span>
  </footer>
</div>
<script type="module">
const Graph = (await import("graphology")).default;
import * as FA2NS from "fa2";
import * as SigmaNS from "sigma";
const forceAtlas2 = FA2NS.default ?? FA2NS;
const Sigma = SigmaNS.Sigma ?? SigmaNS.default;

const TYPE_COLOR = {
  technical_term: "#38bdf8", concept: "#a78bfa", named_entity: "#fbbf24",
  identifier: "#94a3b8", quoted_term: "#f472b6", person: "#34d399",
  project: "#f97316", tool: "#22d3ee", file: "#e879f9",
};
const hashColor = s => `hsl(${[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%360} 65% 60%)`;

const graph = new Graph({ multi: true, type: "directed" });
const renderer = new Sigma(graph, document.getElementById("graph"),
                           { allowInvalidContainer: true, renderEdgeLabels: false,
                             labelDensity: 0.7, labelGridCellSize: 90,
                             defaultEdgeType: "line" });
const container = document.getElementById("graph");

/* ── 时间窗 (slider 截止 = 只看 [最老, cutoff] 的边? 反向: 只看 ≥ cutoff 的新边) ── */
let tMin = Infinity, tMax = -Infinity;   // epoch ms
const tsOf = s => s ? Date.parse(s) : NaN;
let cutoff = 0;                          // epoch ms; 0 = 全部显示
const $ = id => document.getElementById(id);

function noteAttrs(e) {                  // 边 → 记录时间轴范围 (颜色在 edgeReducer 算)
  const ts = tsOf(e.created_at);
  if (Number.isFinite(ts)) { tMin = Math.min(tMin, ts); tMax = Math.max(tMax, ts); }
  return e;
}
function edgeAttrs(e) {
  const ts = tsOf(e.created_at);
  return { id: e.id, _ts: ts, label: e.predicate,
           _topic: e.topic || e.value || "", size: 1, _lif: e.LIF, color: "#475569" };
}

/* ── reducers: 时间窗过滤 + 类型着色 ── */
const visibleEdges = () => {             // 由时间窗算可见边集合
  const vis = new Set();
  graph.forEachEdge((eid, a) => { if (!cutoff || !Number.isFinite(a._ts) || a._ts >= cutoff) vis.add(eid); });
  return vis;
};
let visNodesCache = new Set();
renderer.setSetting("nodeReducer", (node, data) => {
  const t = TYPE_COLOR[data.entity_type] ?? hashColor(data.id);
  return { ...data, color: t,
           size: 2 + Math.sqrt(data.degree ?? 1) * 1.6,
           hidden: cutoff && !visNodesCache.has(node),
           highlighted: node === highlightNode || undefined };
});
renderer.setSetting("edgeReducer", (edge, data) => {
  const vis = !cutoff || !Number.isFinite(data._ts) || data._ts >= cutoff;
  // 年龄色在此处算 (非入图时): tMin/tMax 随增量后移, reducer 每次 refresh 重算保持一致
  const age01 = Number.isFinite(data._ts) && tMax > tMin ? (data._ts - tMin) / (tMax - tMin) : 0;
  return { ...data, hidden: !vis, color: vis ? `hsl(${210 - 190 * age01} 80% ${40 + 20 * age01}%)` : data.color,
           size: vis ? 1 + age01 : 1 };
});
function refreshTimeWindow() {
  visNodesCache = new Set();
  if (cutoff) graph.forEachEdge((eid, a, s, t, _u, _v) => {
    if (!Number.isFinite(a._ts) || a._ts >= cutoff) { visNodesCache.add(s); visNodesCache.add(t); }
  });
  renderer.refresh();
  $("edge-visible").textContent = cutoff
    ? `显示 ${visNodesCache.size} 节点 / ${graph.size} 边中 ${visibleEdges().size} 条`
    : "";
}

/* ── 布局 ── */
function ringPos(n) {                    // 新节点: 靠已有邻居放, 否则外圈
  const nb = graph.neighbors(n);
  for (const x of nb) {
    const a = graph.getNodeAttributes(x);
    if (Number.isFinite(a.x)) {
      const ang = Math.random() * 2 * Math.PI;
      return { x: a.x + Math.cos(ang) * .8, y: a.y + Math.sin(ang) * .8 };
    }
  }
  const ang = Math.random() * 2 * Math.PI, r = 30 + 10 * Math.sqrt(graph.order);
  return { x: Math.cos(ang) * r, y: Math.sin(ang) * r };
}
function layout(iterations = 80) {
  if (graph.order < 2) return;
  try {
    forceAtlas2.assign(graph, { iterations,
      settings: { barnesHutOptimize: graph.order > 800, gravity: 0.6,
                  scalingRatio: 6, slowDown: 1 + Math.log10(graph.order),
                  adjustSizes: true } });
    renderer.refresh(); fitView();
  } catch (err) { console.error("FA2 failed", err); }
}
function fitView() {
  if (!graph.order) return;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, any = false;
  graph.forEachNode((_n, a) => { if (Number.isFinite(a.x)) {
    any = true; minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x);
    minY = Math.min(minY, a.y); maxY = Math.max(maxY, a.y); } });
  if (!any) return;
  const w = maxX - minX, h = maxY - minY;
  renderer.getCamera().animate(
    { x: (minX + maxX) / 2 / (w || 1), y: (minY + maxY) / 2 / (h || 1),
      ratio: Math.max(w, h) > 0 ? 1.6 * Math.max(w, h) / 800 : 1, angle: 0 },
    { duration: 300 });
}

/* ── 快照 + 增量应用 ── */
let cursor = { entity: 0, fact: 0 }, pushes = 0, paused = false, es = null;
function applyDelta(d, isSnapshot = false) {
  const nn = [], ne = [];
  for (const n of d.nodes) {
    if (graph.hasNode(n.id)) { graph.mergeNodeAttributes(n.id, { degree: n.degree }); continue; }
    const pos = isSnapshot ? { x: (Math.random() - .5) * 100, y: (Math.random() - .5) * 100 } : ringPosPre(n);
    graph.addNode(n.id, { ...n, ...pos, size: 2, color: TYPE_COLOR[n.entity_type] ?? hashColor(n.id) });
    nn.push(n);
  }
  for (const e of d.edges) {
    if (!graph.hasNode(e.subject_id) || !graph.hasNode(e.object_id)) continue; // 悬空防线
    if (graph.hasEdge(e.id)) continue;
    // graphology 的带 key 加边是独立方法 (addEdge 无 4 参 (key,s,t,attrs) 形式, 实测会错位)
    graph.addEdgeWithKey(e.id, e.subject_id, e.object_id, edgeAttrs(noteAttrs(e)));
    ne.push(e);
  }
  cursor = d.cursor;
  $("n-nodes").textContent = graph.order; $("n-edges").textContent = graph.size;
  return { nn, ne };
}
// ringPos 依赖图里有邻居 → 拆两步: 先加点(随便放)再在边加完后重摆新节点
const pendingPos = new Set();
function ringPosPre(n) { pendingPos.add(n.id); return { x: 0, y: 0 }; }
function settleNewNodes() {
  for (const id of pendingPos) if (graph.hasNode(id)) Object.assign(graph.getNodeAttributes(id), ringPos(id));
  pendingPos.clear();
}
function logLine(text, cls = "") {
  const el = $("log"), div = document.createElement("div");
  div.innerHTML = text; if (cls) div.className = cls;
  el.prepend(div); while (el.childElementCount > 30) el.lastChild.remove();
}
function applyAndAnnounce(d, tag) {
  const { nn, ne } = applyDelta(d);
  settleNewNodes();
  if (nn.length || ne.length) {
    logLine(`<b>+${nn.length} 节点</b> +${ne.length} 边 · ${tag} · ` +
      nn.slice(0, 3).map(n => n.name).join("、") + (nn.length > 3 ? " …" : ""));
    renderer.refresh();
  }
}

/* ── SSE 订阅 (inotify 事件驱动) ── */
const setConn = (txt, cls) => { const c = $("conn"); c.textContent = txt; c.className = cls ?? ""; };
let everConnected = false;
function connect() {
  if (new URLSearchParams(location.search).has("nosse")) { setConn("nosse 模式", ""); return; }
  if (es) es.close();
  es = new EventSource("/api/stream");
  es.onopen = () => {
    setConn("实时", "live");
    if (everConnected) catchUp();        // 断线重连: 补拉错过的事务
    everConnected = true;
  };
  es.onmessage = ev => {
    if (paused) return;
    const d = JSON.parse(ev.data);
    pushes++; $("n-push").textContent = pushes;
    applyAndAnnounce(d, new Date().toLocaleTimeString());
  };
  es.onerror = () => setConn("重连中…", "off");
}
async function catchUp() {
  const r = await fetch(`/api/graph?after_e=${cursor.entity}&after_f=${cursor.fact}`);
  const d = await r.json();
  if (d.edges?.length || d.nodes?.length) applyAndAnnounce(d, "补拉");
}

/* ── 交互 ── */
let highlightNode = null;
renderer.on("clickNode", ({ node }) => {
  highlightNode = node;
  const a = graph.getNodeAttributes(node);
  $("nd-name").textContent = a.name ?? node;
  $("nd-meta").textContent = `${a.entity_type} · 度 ${a.degree} · ${a.created_at ?? ""}`;
  const al = Array.isArray(a.aliases) ? a.aliases : [];
  $("nd-aliases").textContent = al.length ? `别名: ${al.join(" / ")}` : "";
  const ul = $("nd-edges"); ul.innerHTML = "";
  graph.forEachEdge(node, (eid, ea, _s, _t, sAttr, tAttr) => {
    const other = sAttr.id === node ? tAttr : sAttr;
    const li = document.createElement("li");
    li.innerHTML = `<span class="when">${Number.isFinite(ea._ts) ? new Date(ea._ts).toLocaleDateString() : ""}</span>` +
      `<span class="pred">${ea.label}</span> → ${other.name ?? ""}` +
      (ea._topic ? `<div style="color:var(--dim)">${ea._topic.slice(0, 80)}</div>` : "");
    ul.appendChild(li);
  });
  $("node-card").style.display = "block";
  renderer.refresh();
});
document.querySelector('[data-close="node-card"]').onclick = () => {
  $("node-card").style.display = "none"; highlightNode = null; renderer.refresh();
};
renderer.on("clickStage", () => {
  $("node-card").style.display = "none"; highlightNode = null; renderer.refresh();
});
$("btn-pause").onclick = () => {
  paused = !paused;
  $("btn-pause").textContent = paused ? "恢复推送" : "暂停推送";
  $("btn-pause").className = paused ? "warn" : "";
  if (paused) { es?.close(); setConn("已暂停", "off"); }
  else { catchUp().then(connect); }
};
$("btn-relayout").onclick = () => layout(120);
$("btn-fit").onclick = fitView;
$("slider").oninput = ev => {
  const v = +ev.target.value;
  cutoff = v === 0 ? 0 : tMin + (tMax - tMin) * (v / 1000);
  $("t0").textContent = cutoff ? new Date(cutoff).toLocaleString() : "全部";
  refreshTimeWindow();
};

/* ── 启动 ── */
setConn("加载快照…");
const snap = await (await fetch("/api/graph")).json();
for (const n of snap.nodes) { /* 预摆环形坐标避免全 0 重叠 */
  const ang = Math.random() * 2 * Math.PI, r = 40 * Math.sqrt(snap.nodes.length);
  n.x = Math.cos(ang) * r; n.y = Math.sin(ang) * r;
}
applyDelta(snap, true);
for (const [id, a] of graph.nodes().map(id => [id, graph.getNodeAttributes(id)])) {
  a.color = TYPE_COLOR[a.entity_type] ?? hashColor(id);
}
layout(100);
const initSlider = () => {
  if (!Number.isFinite(tMin)) return;
  $("t1").textContent = new Date(tMax).toLocaleString();
  $("slider").max = "1000";
};
initSlider();
refreshTimeWindow();
logLine(`快照载入: ${snap.nodes.length} 节点 / ${snap.edges.length} 边`, "");
connect();  // headless 冒烟可加 ?nosse=1 跳过 (SSE 长连接会挂住 virtual-time dump)
</script>
</body>
</html>
